name: CATS Pouso Alegre — Aulas inline E2E

on:
  push:
    branches: [main]
    paths:
      - 'presentation-originals.js'
      - 'index.html'
      - 'scripts/e2e_lessons_inline.py'
      - '.github/workflows/cats-lessons-inline-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lessons-inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências de teste
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Servir portal localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cats-lessons-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/cats-lessons-http.log
          exit 1

      - name: E2E — 8 aulas, Drive anônimo, mídia inline e mobile
        run: python scripts/e2e_lessons_inline.py http://127.0.0.1:8765/
