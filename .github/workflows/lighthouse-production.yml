name: Lighthouse — Release Candidate & Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-production.yml'
      - 'index.html'
      - 'precurso.html'
      - 'legacy.html'
      - 'persistence-config.js'
      - 'cats-auth.js'
      - 'cats-auth.css'
      - 'portal-ui.js'
      - 'portal-ui-core.js'
      - 'portal-ui.css'
      - 'presentation-originals.js'
      - 'assets/lessons/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-production.yml'
      - 'index.html'
      - 'precurso.html'
      - 'legacy.html'
      - 'persistence-config.js'
      - 'cats-auth.js'
      - 'cats-auth.css'
      - 'portal-ui.js'
      - 'portal-ui-core.js'
      - 'portal-ui.css'
      - 'presentation-originals.js'
      - 'assets/lessons/**'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lighthouse-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: cats-pouso-alegre
            path: /
          - slug: precurso
            path: /precurso.html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Lighthouse
        run: npm install --global lighthouse@12.8.2

      - name: Servir exatamente o candidato versionado
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cats-pa-lighthouse-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ -o /tmp/cats-pa-index.html; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/cats-pa-lighthouse-http.log
          exit 1

      - name: Smoke local — portal e 8 aulas
        if: matrix.slug == 'cats-pouso-alegre'
        run: |
          set -euo pipefail
          BASE='http://127.0.0.1:8765'
          curl -fsSL --max-time 20 "$BASE/" -o /tmp/cats-home.html
          grep -q 'VIII CATS 2026' /tmp/cats-home.html
          curl -fsSL --max-time 20 "$BASE/presentation-originals.js" -o /tmp/cats-presentation.js
          grep -q "viewer:'local-pdf'" /tmp/cats-presentation.js
          for n in 01 02 03 04 05 06 07 08; do
            file="$(mktemp)"
            curl -fsSL --max-time 30 "$BASE/assets/lessons/aula-$n.pdf" -o "$file"
            test "$(head -c 5 "$file")" = '%PDF-'
            test "$(wc -c < "$file")" -gt 10000
            rm -f "$file"
          done

      - name: Executar Lighthouse 3x no candidato
        env:
          TARGET_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            lighthouse "http://127.0.0.1:8765${TARGET_PATH}" \
              --chrome-flags='--headless --no-sandbox --disable-gpu' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="lighthouse-${run}.json" --quiet
            test -s "lighthouse-${run}.json"
          done

      - name: Mediana, achados e gate mínimo
        run: |
          node <<'NODE'
          const fs=require('fs');
          const reports=[1,2,3].map(i=>JSON.parse(fs.readFileSync(`lighthouse-${i}.json`,'utf8')));
          const keys=['performance','accessibility','best-practices','seo'];
          const scoreOf=(r,k)=>Math.round(r.categories[k].score*100);
          const median=values=>[...values].sort((a,b)=>a-b)[1];
          const scores={};
          console.log('LIGHTHOUSE_RUNS');
          reports.forEach((r,i)=>console.log(`run${i+1} `+keys.map(k=>`${k}=${scoreOf(r,k)}`).join(' ')));
          console.log('LIGHTHOUSE_MEDIAN_SCORES');
          for(const k of keys){
            scores[k]=median(reports.map(r=>scoreOf(r,k)));
            console.log(`${k}=${scores[k]}`);
          }

          // Exibe os achados da execução cuja performance representa a mediana,
          // evitando que um runner isoladamente lento distorça o diagnóstico.
          const ranked=reports.map((r,i)=>({r,i,perf:scoreOf(r,'performance')})).sort((a,b)=>a.perf-b.perf);
          const representative=ranked[1];
          console.log(`LIGHTHOUSE_REPRESENTATIVE_RUN=${representative.i+1}`);
          console.log('LIGHTHOUSE_FINDINGS');
          const rows=[];
          for (const [id,a] of Object.entries(representative.r.audits)) {
            if (a.scoreDisplayMode==='notApplicable' || a.score===null || a.score===1) continue;
            const impact=(a.details&&typeof a.details.overallSavingsMs==='number')?a.details.overallSavingsMs:0;
            rows.push({id,score:a.score,title:a.title,display:a.displayValue||'',impact});
          }
          rows.sort((a,b)=>(a.score??1)-(b.score??1)||b.impact-a.impact);
          for (const x of rows.slice(0,40)) console.log(JSON.stringify(x));

          // SEO é informativo: ambas as superfícies são intencionalmente noindex.
          const minimum={performance:70,accessibility:90,'best-practices':90};
          const failed=Object.entries(minimum).filter(([k,min]) => (scores[k]??0) < min);
          if (failed.length) {
            console.error('LIGHTHOUSE_GATE_FAIL', failed.map(([k,min])=>`${k}<${min}`).join(', '));
            process.exit(1);
          }
          console.log('LIGHTHOUSE_GATE_PASS');
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.slug }}
          path: lighthouse-*.json
          if-no-files-found: error
          retention-days: 14

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Aguardar publicação desta exata revisão
        env:
          BASE: https://ricmurtapsicologia.github.io/CATS.pousoalegre
        run: |
          set -euo pipefail
          local_index="$(sha256sum index.html | awk '{print $1}')"
          local_pre="$(sha256sum precurso.html | awk '{print $1}')"
          echo "local index=$local_index"
          echo "local precurso=$local_pre"

          for i in {1..36}; do
            if curl -fsSL --max-time 20 "$BASE/?sha=$GITHUB_SHA" -o /tmp/prod-home.html \
              && curl -fsSL --max-time 20 "$BASE/precurso.html?sha=$GITHUB_SHA" -o /tmp/prod-precurso.html; then
              remote_index="$(sha256sum /tmp/prod-home.html | awk '{print $1}')"
              remote_pre="$(sha256sum /tmp/prod-precurso.html | awk '{print $1}')"
              if [ "$remote_index" = "$local_index" ] && [ "$remote_pre" = "$local_pre" ]; then
                echo "PRODUCTION_REVISION_MATCH $GITHUB_SHA"
                exit 0
              fi
              echo "Ainda aguardando revisão: tentativa $i; index=$remote_index precurso=$remote_pre"
            fi
            sleep 10
          done
          echo 'A produção não convergiu para os arquivos deste commit dentro da janela.'
          exit 1

      - name: Smoke de produção — portal e 8 aulas
        run: |
          set -euo pipefail
          BASE='https://ricmurtapsicologia.github.io/CATS.pousoalegre'
          curl -fsSL --max-time 20 "$BASE/presentation-originals.js?sha=$GITHUB_SHA" -o /tmp/prod-presentation.js
          grep -q "viewer:'local-pdf'" /tmp/prod-presentation.js
          for n in 01 02 03 04 05 06 07 08; do
            file="$(mktemp)"
            curl -fsSL --max-time 30 "$BASE/assets/lessons/aula-$n.pdf?sha=$GITHUB_SHA" -o "$file"
            test "$(head -c 5 "$file")" = '%PDF-'
            test "$(wc -c < "$file")" -gt 10000
            rm -f "$file"
          done
          echo 'PRODUCTION_SMOKE_PASS_EXACT_REVISION'
