name: Patch CATS retry

on:
  push:
    paths:
      - '.github/workflows/patch-cats-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          oldwf = Path('.github/workflows/patch-cats-form.yml').read_text(encoding='utf-8')
          m = re.search(r"BANNER = '''([^']+)'''", oldwf, re.S)
          if not m:
              raise SystemExit('Banner payload not found')
          Path('assets').mkdir(exist_ok=True)
          Path('assets/cats2026-banner.webp').write_bytes(base64.b64decode(m.group(1)))

          hero = '''<header class="hero">
    <div class="shell">
      <div class="hero-card official-banner-card">
        <img class="hero-banner" src="assets/cats2026-banner.webp" alt="Banner oficial do CATS 2026 — VII edição" width="256" height="256" decoding="async" fetchpriority="high">
        <div class="hero-copy"><h1>Curso de Atendimento a Tentativas de Suicídio — CATS 2026</h1><p>Formulário de inscrição e levantamento prévio.</p></div>
      </div>
    </div>
  </header>'''
          s = re.sub(r'<header class="hero">.*?</header>', hero, s, count=1, flags=re.S)

          css = '''
    /* CATS 2026 — camada responsiva mobile-first */
    .official-banner-card{padding:0;background:transparent;box-shadow:none;overflow:visible}
    .official-banner-card:after{display:none}
    .hero-banner{display:block;width:min(100%,560px);height:auto;margin-inline:auto;border-radius:22px;box-shadow:0 18px 46px rgba(23,50,77,.22)}
    .hero-copy{width:min(100%,760px);margin:15px auto 0;text-align:center}
    .hero-copy h1{margin:.2rem 0 .45rem;color:#17324d;font-size:clamp(1.35rem,6vw,2.25rem)}
    .hero-copy p{margin:0;color:#66717c}
    select{min-height:48px;background:#fff}
    @media(min-width:760px){.hero{padding-top:24px}.hero-banner{width:min(100%,620px)}.card{padding:26px}.grid{gap:16px}}
'''
          if 'CATS 2026 — camada responsiva mobile-first' not in s:
              s = s.replace('</style>', css + '  </style>', 1)

          posto = '''<div class="field"><label for="posto">Posto/Graduação <span class="req">*</span></label><select id="posto" name="entry.55438016" required><option value="">Escolher</option><option value="Cel">Cel</option><option value="Ten Cel">Ten Cel</option><option value="Maj">Maj</option><option value="Cap">Cap</option><option value="1º Ten">1º Ten</option><option value="2º Ten">2º Ten</option><option value="Asp-a-Of.">Asp-a-Of.</option><option value="Cad">Cad</option><option value="Subten">Subten</option><option value="1º Sgt">1º Sgt</option><option value="2º Sgt">2º Sgt</option><option value="3º Sgt">3º Sgt</option><option value="Cb">Cb</option><option value="Sd">Sd</option></select><div class="error"></div></div>'''
          tempo = '''<div class="field"><label for="tempo">Tempo de serviço na instituição <span class="req">*</span></label><select id="tempo" name="entry.1097052870" required><option value="">Escolher</option><option value="até 5 anos.">até 5 anos.</option><option value="de 5 a 10 anos.">de 5 a 10 anos.</option><option value="De 10 a 15 anos.">De 10 a 15 anos.</option><option value="De 15 a 20 anos.">De 15 a 20 anos.</option><option value="de 20 a 25 anos.">de 20 a 25 anos.</option><option value="Mais de 25 anos de serviço.">Mais de 25 anos de serviço.</option></select><div class="error"></div></div>'''
          ocorr = '''<div class="field span-2"><div class="q-title">Já participou de alguma ocorrência de tentativa de suicídio? <span class="req">*</span></div><select id="ocorrencia" name="entry.500885681" required><option value="">Escolher</option><option value="Nunca participei.">Nunca participei.</option><option value="Sim, de 01 a 05 ocorrências">Sim, de 01 a 05 ocorrências</option><option value="Sim, de 06 a 10 ocorrências">Sim, de 06 a 10 ocorrências</option><option value="Sim, em mais de 11 ocorrências">Sim, em mais de 11 ocorrências</option></select><div class="error"></div></div>'''
          pres = '''<div class="field span-2"><div class="q-title">Já presenciou algum suicídio completo? <span class="req">*</span></div><select id="presenciou" name="entry.212330805" required><option value="">Escolher</option><option value="Nunca presenciei.">Nunca presenciei.</option><option value="Sim, de 01 a 05 suicídios completos.">Sim, de 01 a 05 suicídios completos.</option><option value="Sim, de 06 a 10 suicídios completos.">Sim, de 06 a 10 suicídios completos.</option><option value="Sim, em mais de 11 suicídios completos.">Sim, em mais de 11 suicídios completos.</option></select><div class="error"></div></div>'''

          s = re.sub(r'<div class="field"><label for="posto">.*?(?=\n\s*<div class="field"><label for="tempo">)', posto, s, count=1, flags=re.S)
          s = re.sub(r'<div class="field"><label for="tempo">.*?(?=\n\s*<div class="field"><label for="email">)', tempo, s, count=1, flags=re.S)
          s = re.sub(r'<div class="field span-2"><div class="q-title">Experiência prévia em ocorrência.*?(?=\n\s*<div class="field span-2"><div class="q-title">Já presenciou)', ocorr, s, count=1, flags=re.S)
          s = re.sub(r'<div class="field span-2"><div class="q-title">Já presenciou suicídio completo\?.*?(?=\n\s*</div>\n\s*<div class="actions">)', pres, s, count=1, flags=re.S)

          s = s.replace("title: 'Irritabilidade',\n      entry: '',", "title: 'Irritabilidade',\n      entry: 'entry.327261555',")

          if 'name="pageHistory"' not in s:
              s = s.replace('novalidate>', 'novalidate><input type="hidden" name="fvv" value="1"><input type="hidden" name="pageHistory" value="0,1,2,3"><input type="hidden" name="submit" value="Submit">', 1)

          s = s.replace('const CONFIG_READY = true;', "const REQUIRED_ENTRIES = ['entry.500885681','entry.327261555'];\n  const CONFIG_READY = REQUIRED_ENTRIES.every(name => document.querySelector(`[name=\\\"${name}\\\"]`));")
          s = s.replace('<div class="success-icon">✓</div><h2>Inscrição registrada</h2><p>Os dados foram enviados com sucesso. Você já pode fechar esta página.</p>', '<div class="success-icon">✓</div><h2>Envio concluído</h2><p>As respostas foram encaminhadas ao Google Forms.</p>')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/cats2026-banner.webp
          git diff --cached --quiet || git commit -m "Finaliza CATS mobile e integração Forms [skip ci]"
          git push
