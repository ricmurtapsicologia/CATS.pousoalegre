name: CATS Pré-curso — E2E real de produção

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/precurso-production-e2e.yml'

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: E2E real — página pública → Google Forms → planilha → sucesso
        env:
          TARGET_URL: https://ricmurtapsicologia.github.io/CATS.pousoalegre/precurso.html
          PERSISTENCE_URL: https://script.google.com/macros/s/AKfycbzOINm3ehG2ojEuSyFSYIuOfKciTGTg37GZ4lvC_AKfV0_00nU4GU8uxFwOpgefPTE/exec
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from playwright.sync_api import sync_playwright

          target = os.environ['TARGET_URL']
          persistence_url = os.environ['PERSISTENCE_URL']
          run_id = os.environ.get('GITHUB_RUN_ID', str(int(time.time())))
          marker = f'CATS-E2E-PROD-FULL-{run_id}-{int(time.time())}'
          test_email = f'cats.e2e.{run_id}@example.invalid'

          with urllib.request.urlopen(persistence_url, timeout=30) as response:
              runtime = json.load(response)
          assert runtime.get('status') == 'ready', runtime
          assert runtime.get('formEditId') == '1107fjdaiL42Zb0n2jNjKr0aiNNysyEADQCesdBTbD_E', runtime
          assert runtime.get('sheetId') == '1wQ0nc6TmCqqbu-ZqloIRLptO6iHqDhD00qrFLxP-fUk', runtime
          print(f'BACKEND_RUNTIME_PRE={runtime.get("runtimeVersion")}')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width': 390, 'height': 844})
              page = context.new_page()
              form_posts = []

              def on_request(req):
                  if req.method == 'POST' and req.url.endswith('/formResponse'):
                      form_posts.append({'url': req.url, 'method': req.method})

              page.on('request', on_request)
              page.goto(target, wait_until='networkidle', timeout=60000)
              page.wait_for_selector('#app.ready', timeout=20000)
              page.wait_for_selector('#catsAuthGate[data-cats-pa-branded="true"]', timeout=15000)

              payload = {
                  'authenticated': True,
                  'createdAt': int(time.time() * 1000),
                  'expiresAt': int(time.time() * 1000) + 8 * 60 * 60 * 1000,
                  'version': 3,
              }
              page.evaluate("""payload => {
                sessionStorage.setItem('cats_pa_auth_v1', JSON.stringify(payload));
                const gate = document.getElementById('catsAuthGate');
                if (gate) gate.hidden = true;
                document.documentElement.classList.remove('cats-auth-locked');
                window.dispatchEvent(new CustomEvent('cats:authenticated', {detail:{source:'production-e2e'}}));
              }""", payload)

              iframe_handle = page.locator('#app').element_handle()
              assert iframe_handle is not None
              frame = iframe_handle.content_frame()
              assert frame is not None
              form = frame.locator('#catsForm')
              form.wait_for(state='visible', timeout=15000)

              assert frame.locator('.step').count() == 3
              assert frame.locator('.clinical-item').count() == 21
              assert page.evaluate('document.documentElement.scrollWidth <= document.documentElement.clientWidth + 2')
              assert frame.evaluate('document.documentElement.scrollWidth <= document.documentElement.clientWidth + 2')

              frame.locator('#nome').fill(marker)
              frame.locator('#posto').select_option(label='Cap')
              frame.locator('#tempo').select_option(index=1)
              frame.locator('#email').fill(test_email)
              frame.locator('#instituicao').fill('CBMMG TESTE E2E')
              frame.locator('#unidade').fill('UNIDADE TESTE AUTOMATIZADO')
              frame.locator('#registro').fill('0000000')
              frame.locator('#cpf').fill('11144477735')
              frame.locator('#sangue').fill('O+')
              frame.locator('input[name="entry.192985690"][value="Não."]').evaluate('el => el.click()')
              if not frame.locator('#data').input_value():
                  frame.locator('#data').fill('2026-09-18')
              frame.locator('[data-step="1"] [data-next]').click()
              frame.locator('[data-step="2"].active').wait_for(timeout=10000)

              frame.locator('#motivo').fill(f'Teste E2E completo de produção — {marker}')
              frame.locator('#ocorrencia').select_option(label='Nunca atendi.')
              frame.locator('#presenciou').select_option(index=1)
              frame.locator('[data-step="2"] [data-next]').click()
              frame.locator('[data-step="3"].active').wait_for(timeout=10000)

              names = frame.locator('.clinical-item input[type="radio"]').evaluate_all(
                  "els => [...new Set(els.map(e => e.name))]"
              )
              assert len(names) == 21, names
              for name in names:
                  frame.locator(f'input[name="{name}"]').first.evaluate('el => el.click()')
              assert frame.locator('[required]:invalid').count() == 0

              frame.locator('#submitBtn').click()

              pending = frame.locator('#catsSubmitPending')
              pending.wait_for(state='visible', timeout=10000)
              pending_text = pending.inner_text()
              assert 'Envio realizado' in pending_text, pending_text
              assert 'confirmando o registro' in pending_text, pending_text
              assert form.is_hidden()
              assert 'bdi-ii' not in frame.locator('body').inner_text().lower()
              assert form_posts, 'Nenhum POST real para /formResponse foi observado.'

              success = frame.locator('#success[data-persistence-confirmed="true"]')
              success.wait_for(state='visible', timeout=150000)
              success_text = success.inner_text()
              assert 'Parabéns! Sua participação foi registrada com sucesso.' in success_text, success_text
              assert 'Seja bem-vindo(a) ao VIII Curso de Atendimento a Tentativas de Suicídio' in success_text, success_text
              assert 'CATS 2026' in success_text, success_text
              assert 'Pouso Alegre' in success_text, success_text
              assert pending.is_hidden()
              assert form.is_hidden()
              assert 'bdi-ii' not in frame.locator('body').inner_text().lower()

              print(f'PROD_E2E_MARKER={marker}')
              print(f'PROD_E2E_EMAIL={test_email}')
              print(f'FORM_POST_COUNT={len(form_posts)}')
              print(f'BACKEND_RUNTIME={runtime.get("runtimeVersion")}')
              print('PROD_E2E_RESULT=PASS')
              context.close()
              browser.close()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lighthouse — precurso.html em produção
        env:
          TARGET_URL: https://ricmurtapsicologia.github.io/CATS.pousoalegre/precurso.html
        run: |
          npm install --global lighthouse@12.8.2
          lighthouse "$TARGET_URL" \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=lighthouse-precurso-production.json --quiet
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('lighthouse-precurso-production.json','utf8'));
          console.log('LIGHTHOUSE_PRODUCTION_SCORES');
          for (const [k,v] of Object.entries(r.categories)) {
            console.log(`${k}=${Math.round(v.score*100)}`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: precurso-production-e2e-lighthouse
          path: lighthouse-precurso-production.json
          retention-days: 7
