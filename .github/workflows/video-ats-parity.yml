name: CATS Pouso Alegre — Vídeos no padrão ATS

on:
  push:
    branches: [main]
    paths:
      - 'presentation-originals.js'
      - 'portal-ui.js'
      - 'index.html'
      - 'scripts/e2e_video_ats_parity.py'
      - '.github/workflows/video-ats-parity.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  video-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Servir portal localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cats-video-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/cats-video-http.log
          exit 1

      - name: Smoke + E2E dos vídeos
        run: python scripts/e2e_video_ats_parity.py http://127.0.0.1:8765/
