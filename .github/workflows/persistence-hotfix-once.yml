name: CATS Pré-curso — Cache-bust hotfix (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persistence-hotfix-once.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Forçar carregamento do hotfix r9
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('precurso.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('persistence-config.js?v=20260918-1', 'persistence-config.js?v=20260918-r9-auto')
          s = s.replace('2026.09.18-r7-persistence', '2026.09.18-r9-auto')
          if s == old:
              raise SystemExit('Nenhuma alteração aplicada: tokens esperados não encontrados')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar referências do build
        run: |
          grep -q 'persistence-config.js?v=20260918-r9-auto' precurso.html
          grep -q '2026.09.18-r9-auto' precurso.html
          grep -q "formResponse" precurso.html
          grep -q "RESPONSE_SHEET_ID" precurso.html

      - name: Publicar cache-bust
        run: |
          git config user.name 'CATS Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add precurso.html
          git commit -m 'Hotfix: cache-bust do verificador automático do pré-curso'
          git push origin HEAD:main
