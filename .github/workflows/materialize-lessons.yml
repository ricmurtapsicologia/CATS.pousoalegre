name: CATS — Materializar aulas internas

on:
  push:
    branches: [main]
    paths: ['.github/workflows/materialize-lessons.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Baixar fontes canônicas autorizadas
        env:
          U1: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-93ac-820e-af51-9cffafffad98/raw?se=2026-09-20T16%3A11%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=f0653afd-2317-5509-8dbc-28f6ee95bd31&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T06%3A48%3A44Z&ske=2026-09-21T06%3A48%3A44Z&sks=b&skv=2026-02-06&sig=UoFqjAOBpsdxnXRoZIfXvdvov78C0h1rJW/FoZd9t2g%3D'
          U2: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9fd0-820e-83de-e8d6f27f8b3a/raw?se=2026-09-20T16%3A11%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=a969fd1c-39d1-54dd-94e8-caafb764fa6a&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T12%3A58%3A45Z&ske=2026-09-21T12%3A58%3A45Z&sks=b&skv=2026-02-06&sig=zVQVK8FJ9FuMaVG5K4LaW8/ZMutTpCaEps4TKYfvHlE%3D'
          U3: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6a00-820e-a56c-01e2cbfbec97/raw?se=2026-09-20T16%3A11%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=04e1ca66-b359-51a0-8529-c8961818799b&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T12%3A18%3A54Z&ske=2026-09-21T12%3A18%3A54Z&sks=b&skv=2026-02-06&sig=2r3BMUCjW5TOvgPafeyqYuqy3jJDM6Ai/iuBlRjb8Uk%3D'
          U4: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4270-820e-be4b-5febfcf65c64/raw?se=2026-09-20T16%3A11%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=426f34b7-775c-5e1f-9a12-a1411f9ac479&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T03%3A38%3A30Z&ske=2026-09-21T03%3A38%3A30Z&sks=b&skv=2026-02-06&sig=8q7ApJbTCwLaDpi7YHk/xPVi05ugKFjfAp94Qf%2B01oY%3D'
          U5: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-aa0c-820e-b3d3-22690dbda77b/raw?se=2026-09-20T16%3A11%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=c7f31af3-bae8-59eb-8b8f-8cc681f52780&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A40%3A58Z&ske=2026-09-21T13%3A40%3A58Z&sks=b&skv=2026-02-06&sig=oxFa%2BMiWCHohWcpnFBIe5zVTNAWL7Ncb2SJ/OrEkZA0%3D'
          U6: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-49d4-820e-a97e-e38c51ad0b4c/raw?se=2026-09-20T16%3A12%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=b4ebe4ea-a91f-5277-a48f-7bb7da34ecf2&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T14%3A58%3A48Z&ske=2026-09-21T14%3A58%3A48Z&sks=b&skv=2026-02-06&sig=uqBbUG715aUHQ7O06bZ4TVeY0G9KZeGf8gvpCXhTnw4%3D'
          U7: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c0f8-820e-9c12-ea00f5b76038/raw?se=2026-09-20T16%3A12%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=69137816-c315-5652-8523-8096da36c7b1&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T00%3A45%3A24Z&ske=2026-09-21T00%3A45%3A24Z&sks=b&skv=2026-02-06&sig=X1DYPm1khNOS58bXBCmWqYbJYIk7trY79zSh7LhP52M%3D'
          U8: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3f74-820e-b3b8-20405e39b840/raw?se=2026-09-20T16%3A12%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=66124795-558e-50e2-aad9-c2b98e3c0876&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T00%3A40%3A55Z&ske=2026-09-21T00%3A40%3A55Z&sks=b&skv=2026-02-06&sig=T1RqjLYPUxLoHJnzQdMWDNRAdPwDayFzhQKkH0cnkIg%3D'
        run: |
          set -euo pipefail
          mkdir -p _lesson_sources assets/lessons
          for n in 1 2 3 4 5 6 7 8; do
            var="U${n}"; url="${!var}"
            printf 'Baixando aula %s...\n' "$n"
            curl --fail --location --retry 2 --connect-timeout 15 "$url" -o "_lesson_sources/aula-0${n}.pptx"
            test -s "_lesson_sources/aula-0${n}.pptx"
          done
          ls -lh _lesson_sources

      - name: Instalar conversor de apresentações
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress >/dev/null

      - name: Gerar cópias de visualização PDF
        run: |
          set -euo pipefail
          mkdir -p assets/lessons
          for n in 1 2 3 4 5 6 7 8; do
            profile="file:///tmp/lo-profile-${n}"
            libreoffice "-env:UserInstallation=${profile}" --headless --convert-to pdf --outdir assets/lessons "_lesson_sources/aula-0${n}.pptx"
            test -s "assets/lessons/aula-0${n}.pdf"
          done
          ls -lh assets/lessons

      - name: Publicar visualizações internas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lessons/*.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'CATS: publicar visualizações internas das 8 aulas'
          git push
