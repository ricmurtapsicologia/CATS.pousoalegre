name: VIII CATS Pouso Alegre — Hardening Materialization

on:
  push:
    branches:
      - hardening/release-gate-20260927

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Materializar correção canônica do pré-curso
        run: |
          set -euo pipefail
          python scripts/precurso_submission_hardening.py
      - name: Commitar somente o estado materializado
        run: |
          set -euo pipefail
          if git diff --quiet -- precurso.html legacy.html; then
            echo 'Nenhuma materialização necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add precurso.html legacy.html
          git commit -m 'fix: materialize canonical CPF submission contract'
          git push origin HEAD:hardening/release-gate-20260927
