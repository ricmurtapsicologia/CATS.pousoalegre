name: VIII CATS Pouso Alegre — Build e Auditorias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cats-pa-gate.yml'
      - 'index.html'
      - 'precurso.html'
      - 'legacy.html'
      - 'persistence-config.js'
      - 'apps-script/CATS_PersistenceVerifier.gs'
      - 'scripts/finalize_theory_surface.py'
      - 'scripts/performance_hotfix.py'
      - 'scripts/precurso_submission_hardening.py'
      - 'scripts/qep_precurso_gate.py'
      - 'scripts/qa_30_30.py'
      - 'scripts/qa_90_90.py'
      - 'scripts/e2e_precurso.py'
      - 'scripts/e2e_portal.py'
      - 'cats-auth.js'
      - 'cats-auth.css'
      - 'portal-ui.css'
      - 'portal-ui.js'
      - 'portal-ui-core.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Usar a página atual como fonte canônica
        run: |
          test -s index.html
          test -s precurso.html
          test -s legacy.html
          test -s persistence-config.js

      - name: Sanear superfície final para oito aulas teóricas
        run: python scripts/finalize_theory_surface.py

      - name: Aplicar hotfix persistente de performance
        run: python scripts/performance_hotfix.py

      - name: Hotfix — persistência segura do pré-curso
        run: python scripts/precurso_submission_hardening.py

      - name: Auditoria 30/30 — técnica e institucional
        run: python scripts/qa_30_30.py

      - name: Auditoria 90/90 — editorial e experiência
        run: python scripts/qa_90_90.py

      - name: QEP — 24 dimensões / 397 slots canônicos
        run: python scripts/qep_precurso_gate.py

      - name: Instalar navegador de teste
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Servir versão auditada localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cats-pa-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/cats-pa-http.log
          exit 1

      - name: E2E — pré-curso, persistência fail-closed e mobile
        run: python scripts/e2e_precurso.py http://127.0.0.1:8765/

      - name: E2E — autenticação, aulas, recursos, pré-curso e mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/e2e_portal.py')
          s=p.read_text(encoding='utf-8')
          old='w.locator("#ob-next").click()'
          new='w.locator("#ob-next").click(force=True)'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          python scripts/e2e_portal.py http://127.0.0.1:8765/

      - name: Publicar somente após 30/30, 90/90, QEP e E2E aprovados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+ricmurtapsicologia@users.noreply.github.com'
          git add index.html precurso.html legacy.html README.md
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração de artefato.'
          else
            git commit -m 'Publica VIII CATS Pouso Alegre após 30/30, 90/90, QEP e E2E'
            git push origin HEAD:main
          fi
