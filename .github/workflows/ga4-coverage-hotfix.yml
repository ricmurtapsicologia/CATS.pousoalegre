name: GA4 Coverage Hotfix

on:
  push:
    branches: [hotfix/ga4-coverage-20260920]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/ga4-coverage-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply canonical GA4 instrumentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          GA='G-N1GEBDNZ8B'
          CORE='https://ricmurtapsicologia.github.io/RPD/assets/js/ric-analytics.js?v=1.1.3'

          def normalize(filename, page_id):
              p=Path(filename)
              s=p.read_text(encoding='utf-8')
              # Remove the legacy direct GA block if present. Shared RIC core owns GA4.
              s=re.sub(
                  r'\n\s*<!-- Google Analytics \(defer\) -->\s*'
                  r'<script defer src="https://www\.googletagmanager\.com/gtag/js\?id=G-38D052F915"></script>\s*'
                  r'<script>\s*window\.dataLayer = window\.dataLayer \|\| \[\];\s*'
                  r'function gtag\(\)\{ dataLayer\.push\(arguments\); \}\s*'
                  r"gtag\('js', new Date\(\)\);\s*gtag\('config', 'G-38D052F915'\);\s*</script>\s*",
                  '\n', s, count=1, flags=re.S)
              # Remove any stale RIC analytics tags, then add one canonical block.
              s=re.sub(r'\n?\s*<meta name="ric-analytics-page"[^>]*>\s*', '\n', s)
              s=re.sub(r'\n?\s*<meta name="ric-analytics-privacy"[^>]*>\s*', '\n', s)
              s=re.sub(r'\n?\s*<meta name="ric-analytics-ga"[^>]*>\s*', '\n', s)
              s=re.sub(r'\n?\s*<script[^>]+ric-analytics\.js\?v=[^"\']+["\'][^>]*></script>\s*', '\n', s)
              block=(f'\n  <meta name="ric-analytics-page" content="{page_id}">\n'
                     f'  <meta name="ric-analytics-privacy" content="public">\n'
                     f'  <meta name="ric-analytics-ga" content="{GA}">\n'
                     f'  <script src="{CORE}" defer></script>\n')
              if '</head>' not in s:
                  raise SystemExit(f'{filename}: </head> ausente')
              s=s.replace('</head>', block+'</head>', 1)
              p.write_text(s, encoding='utf-8')

          normalize('index.html','cats-pouso-alegre')
          normalize('precurso.html','cats-precurso')
          PY
      - name: Validate canonical coverage and privacy boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          GA='G-N1GEBDNZ8B'
          checks={'index.html':'cats-pouso-alegre','precurso.html':'cats-precurso'}
          for filename,page_id in checks.items():
              s=Path(filename).read_text(encoding='utf-8')
              assert s.count(f'<meta name="ric-analytics-page" content="{page_id}">') == 1
              assert s.count('<meta name="ric-analytics-privacy" content="public">') == 1
              assert s.count(f'<meta name="ric-analytics-ga" content="{GA}">') == 1
              assert s.count('ric-analytics.js?v=1.1.3') == 1
              assert 'G-38D052F915' not in s, f'{filename}: legacy property remains'
              assert 'googletagmanager.com/gtag/js?id=' not in s, f'{filename}: direct GA tag remains'
          # Sensitive pre-course form values remain outside analytics: no field names wired into RIC tags.
          pre=Path('precurso.html').read_text(encoding='utf-8')
          block=pre[pre.index('<meta name="ric-analytics-page"'):pre.index('</head>')]
          for forbidden in ['CPF','BDI','alerg','sangue','diagn']:
              assert forbidden.lower() not in block.lower()
          print('CATS_GA4_COVERAGE_OK')
          PY
      - name: Commit content patch to hotfix branch
        run: |
          if git diff --quiet -- index.html precurso.html; then
            echo 'No content patch needed.'
            exit 0
          fi
          git config user.name 'ricmurtapsicologia'
          git config user.email '164411318+ricmurtapsicologia@users.noreply.github.com'
          git add index.html precurso.html
          git commit -m 'hotfix: unify CATS GA4 on canonical property'
          git push origin HEAD:hotfix/ga4-coverage-20260920
