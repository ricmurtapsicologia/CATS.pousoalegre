name: CATS Pré-curso — Smoke e E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/precurso-smoke-e2e.yml'
      - 'precurso.html'
      - 'legacy.html'
      - 'persistence-config.js'
      - 'cats-auth.js'
      - 'cats-auth.css'
      - 'apps-script/CATS_PersistenceVerifier.gs'
      - 'scripts/e2e_precurso.py'
      - 'docs/precurso-persistence-spec.md'
      - 'docs/PRECURSO_PERSISTENCE_HOTFIX_SPEC.md'
      - 'docs/PRECURSO_E2E_FINAL_SPEC.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Contrato do backend — persistência e e-mail idempotente
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('apps-script/CATS_PersistenceVerifier.gs').read_text(encoding='utf-8')
          required = [
              "runtimeVersion: '2026.09.18-r3-email-idempotent'",
              "payload.notifyEmail === true",
              "notifyPersistedResponse_(sheet, absoluteRow, 'verification')",
              "notifyPersistedResponse_(sheet, row, 'sheet-trigger')",
              'LockService.getScriptLock()',
              'PropertiesService.getScriptProperties()',
              "return 'already-sent'",
              'MailApp.sendEmail',
          ]
          missing = [item for item in required if item not in src]
          assert not missing, f'Contrato de backend incompleto: {missing}'
          assert 'if (lowerBound && ts && ts < lowerBound) break;' not in src, 'Regressão de clock skew detectada'
          print('PASS: backend com dupla rota idempotente e sem corte por relógio local.')
          PY

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Servir página localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cats-pre-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/precurso.html >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/cats-pre-http.log
          exit 1

      - name: Smoke live do verificador — negativo, positivo e clock skew
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time

          FORM_ID = '1107fjdaiL42Zb0n2jNjKr0aiNNysyEADQCesdBTbD_E'
          SHEET_ID = '1wQ0nc6TmCqqbu-ZqloIRLptO6iHqDhD00qrFLxP-fUk'
          NEGATIVE_FINGERPRINT = '0' * 64
          # Hash de fixture sintética histórica já persistida na planilha.
          # Não contém PII em claro e não cria nova resposta.
          POSITIVE_FIXTURE_FINGERPRINT = 'a50d501a888c52b5d648b46073bbb783382f8ea8007b3052ebe2a19ee18ce7df'

          JS = '''async ({formId, sheetId, fingerprint, submittedAtEpochMs}) => {
            return await window.__CATS_PERSISTENCE_VERIFY__({
              protocol: 'cats-persistence-v1',
              formEditId: formId,
              sheetId,
              submittedAtEpochMs,
              fingerprint
            });
          }'''

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('http://127.0.0.1:8765/precurso.html', wait_until='domcontentloaded')
              endpoint = page.evaluate('window.CATS_PERSISTENCE_VERIFY_URL')
              timeout = page.evaluate('Number(window.__CATS_PERSISTENCE_VERIFY_TIMEOUT__ || 0)')
              wrapper = page.evaluate("typeof window.__CATS_PERSISTENCE_VERIFY__ === 'function'")
              assert endpoint.startswith('https://script.google.com/macros/s/') and endpoint.endswith('/exec'), endpoint
              assert wrapper, 'Wrapper do hotfix não instalado'
              assert 10000 <= timeout <= 30000, f'Janela UX fora do spec: {timeout}ms'

              # Simula notebook 10 minutos adiantado. O hotfix deve neutralizar esse
              # relógio local antes de consultar o backend.
              skewed_client_now = int(time.time() * 1000) + 10 * 60 * 1000

              negative = page.evaluate(JS, {
                  'formId': FORM_ID,
                  'sheetId': SHEET_ID,
                  'fingerprint': NEGATIVE_FINGERPRINT,
                  'submittedAtEpochMs': skewed_client_now,
              })
              assert negative['protocol'] == 'cats-persistence-v1', negative
              assert negative['persisted'] is False, negative
              assert negative['terminal'] is False, negative
              assert negative['reason'] == 'row-not-yet-visible', negative
              assert negative['formEditId'] == FORM_ID, negative
              assert negative['sheetId'] == SHEET_ID, negative
              assert negative['fingerprint'] == NEGATIVE_FINGERPRINT, negative

              positive = page.evaluate(JS, {
                  'formId': FORM_ID,
                  'sheetId': SHEET_ID,
                  'fingerprint': POSITIVE_FIXTURE_FINGERPRINT,
                  'submittedAtEpochMs': skewed_client_now,
              })
              assert positive['protocol'] == 'cats-persistence-v1', positive
              assert positive['persisted'] is True, positive
              assert positive['terminal'] is True, positive
              assert positive['formEditId'] == FORM_ID, positive
              assert positive['sheetId'] == SHEET_ID, positive
              assert positive['fingerprint'] == POSITIVE_FIXTURE_FINGERPRINT, positive
              browser.close()

          print('PASS: hotfix neutraliza clock skew, confirma fixture existente e rejeita fingerprint inexistente.')
          PY

      - name: Smoke + E2E do formulário
        run: python scripts/e2e_precurso.py http://127.0.0.1:8765/
