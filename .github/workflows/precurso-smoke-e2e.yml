name: CATS Pré-curso — Smoke e E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/precurso-smoke-e2e.yml'
      - 'precurso.html'
      - 'legacy.html'
      - 'persistence-config.js'
      - 'cats-auth.js'
      - 'cats-auth.css'
      - 'scripts/e2e_precurso.py'
      - 'docs/precurso-persistence-spec.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Servir página localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/cats-pre-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/precurso.html >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/cats-pre-http.log
          exit 1

      - name: Smoke live do verificador — negativo e positivo
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          FORM_ID = '1107fjdaiL42Zb0n2jNjKr0aiNNysyEADQCesdBTbD_E'
          SHEET_ID = '1wQ0nc6TmCqqbu-ZqloIRLptO6iHqDhD00qrFLxP-fUk'
          NEGATIVE_FINGERPRINT = '0' * 64
          # Hash de uma fixture sintética histórica já persistida na planilha.
          # Não contém PII em claro e não cria nova resposta.
          POSITIVE_FIXTURE_FINGERPRINT = 'a50d501a888c52b5d648b46073bbb783382f8ea8007b3052ebe2a19ee18ce7df'

          JS = '''async ({endpoint, formId, sheetId, fingerprint, submittedAtEpochMs}) => {
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type':'text/plain;charset=UTF-8'},
                body: JSON.stringify({
                  protocol: 'cats-persistence-v1',
                  formEditId: formId,
                  sheetId,
                  submittedAtEpochMs,
                  fingerprint
                }),
                cache: 'no-store',
                credentials: 'omit',
                redirect: 'follow'
              });
              const text = await response.text();
              return {ok: response.ok, status: response.status, text};
            } catch (error) {
              return {ok:false, status:0, error:String(error)};
            }
          }'''

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('http://127.0.0.1:8765/precurso.html', wait_until='domcontentloaded')
              endpoint = page.evaluate('window.CATS_PERSISTENCE_VERIFY_URL')
              timeout = page.evaluate('Number(window.__CATS_PERSISTENCE_VERIFY_TIMEOUT__ || 0)')
              assert endpoint.startswith('https://script.google.com/macros/s/') and endpoint.endswith('/exec'), endpoint
              assert timeout >= 60000, f'Janela de consistência insuficiente: {timeout}ms'

              negative = page.evaluate(JS, {
                  'endpoint': endpoint,
                  'formId': FORM_ID,
                  'sheetId': SHEET_ID,
                  'fingerprint': NEGATIVE_FINGERPRINT,
                  'submittedAtEpochMs': 0,
              })
              assert negative.get('ok'), negative
              neg = json.loads(negative['text'])
              assert neg['protocol'] == 'cats-persistence-v1', neg
              assert neg['persisted'] is False, neg
              assert neg['terminal'] is False, neg
              assert neg['reason'] == 'row-not-yet-visible', neg
              assert neg['formEditId'] == FORM_ID, neg
              assert neg['sheetId'] == SHEET_ID, neg
              assert neg['fingerprint'] == NEGATIVE_FINGERPRINT, neg

              positive = page.evaluate(JS, {
                  'endpoint': endpoint,
                  'formId': FORM_ID,
                  'sheetId': SHEET_ID,
                  'fingerprint': POSITIVE_FIXTURE_FINGERPRINT,
                  'submittedAtEpochMs': 0,
              })
              assert positive.get('ok'), positive
              pos = json.loads(positive['text'])
              assert pos['protocol'] == 'cats-persistence-v1', pos
              assert pos['persisted'] is True, pos
              assert pos['terminal'] is True, pos
              assert pos['formEditId'] == FORM_ID, pos
              assert pos['sheetId'] == SHEET_ID, pos
              assert pos['fingerprint'] == POSITIVE_FIXTURE_FINGERPRINT, pos
              browser.close()

          print('PASS: verificador live prova ausência e presença reais na planilha oficial; janela de consistência >= 60s.')
          PY

      - name: Smoke + E2E do formulário
        run: python scripts/e2e_precurso.py http://127.0.0.1:8765/
