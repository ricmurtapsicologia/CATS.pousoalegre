name: CATS — Forms contract probe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/forms-contract-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar formulário público
        run: |
          curl -fsSL --max-time 30 'https://docs.google.com/forms/d/e/1FAIpQLScVj6HESm2cWDN3sNQCaoNOtWSKini7NbSHgiTXemwlyvqAXg/viewform' -o /tmp/form.html
          echo "BYTES=$(wc -c < /tmp/form.html)"
          echo "HAS_EMAILADDRESS=$(grep -q 'emailAddress' /tmp/form.html && echo true || echo false)"
          echo "HAS_500885681=$(grep -q '500885681' /tmp/form.html && echo true || echo false)"
          echo "HAS_327261555=$(grep -q '327261555' /tmp/form.html && echo true || echo false)"
          echo "HAS_NUNCA_ATENDI=$(grep -q 'Nunca atendi' /tmp/form.html && echo true || echo false)"
          echo "HAS_NUNCA_PARTICIPEI=$(grep -q 'Nunca participei' /tmp/form.html && echo true || echo false)"
