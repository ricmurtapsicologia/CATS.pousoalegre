name: CATS — Forms contract probe

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/forms-contract-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar formulário público
        run: |
          curl -fsSL --max-time 30 'https://docs.google.com/forms/d/e/1FAIpQLScVj6HESm2cWDN3sNQCaoNOtWSKini7NbSHgiTXemwlyvqAXg/viewform' -o form-public.html
          echo "BYTES=$(wc -c < form-public.html)"
          echo "HAS_EMAILADDRESS=$(grep -q 'emailAddress' form-public.html && echo true || echo false)"
          echo "HAS_500885681=$(grep -q '500885681' form-public.html && echo true || echo false)"
          echo "HAS_327261555=$(grep -q '327261555' form-public.html && echo true || echo false)"
          echo "HAS_NUNCA_ATENDI=$(grep -q 'Nunca atendi' form-public.html && echo true || echo false)"
          echo "HAS_NUNCA_PARTICIPEI=$(grep -q 'Nunca participei' form-public.html && echo true || echo false)"

      - uses: actions/upload-artifact@v4
        with:
          name: google-forms-public-contract
          path: form-public.html
          retention-days: 1
