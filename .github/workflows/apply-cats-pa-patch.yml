name: Apply CATS PA patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-cats-pa-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_cats_pa.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'CATS Pouso Alegre: onboarding e contato do coordenador'
          git push
# retry-safe-2
