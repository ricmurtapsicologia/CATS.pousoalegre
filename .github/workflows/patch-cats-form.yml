name: Patch CATS form

on:
  push:
    paths:
      - '.github/workflows/patch-cats-form.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CATS patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          BANNER = ''''''

          css_patch = '''
          .hero{padding:12px 0 18px}.hero-card{padding:0;background:transparent;box-shadow:none;border-radius:22px}.hero-card:after{display:none}
          .hero-banner{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;border-radius:22px;box-shadow:0 18px 46px rgba(23,50,77,.22)}
          .hero-copy{max-width:760px;margin:16px auto 0;text-align:center;color:#243342}.hero-copy h1{color:#17324d;margin:.2rem 0 .5rem;font-size:clamp(1.45rem,5vw,2.25rem)}.hero-copy p{margin:0;color:#5f6b76}
          select{appearance:auto;background-color:#fff}.field select{min-height:48px}
          @media(min-width:760px){.hero{padding-top:24px}.hero-banner{max-width:620px}.card{padding:26px}.grid{gap:16px}}
          '''

          hero = '''<header class="hero"><div class="shell"><div class="hero-card"><img class="hero-banner" src="assets/cats2026-banner.webp" alt="Banner oficial CATS 2026 — VII edição" width="256" height="256" decoding="async" fetchpriority="high"><div class="hero-copy"><h1>Curso de Atendimento a Tentativas de Suicídio — CATS 2026</h1><p>Formulário de inscrição e levantamento prévio.</p></div></div></div></header>'''

          posto = '''<div class="field"><label for="posto">Posto/Graduação <span class="req">*</span></label><select id="posto" name="entry.55438016" required><option value="">Escolher</option><option value="Cel">Cel</option><option value="Ten Cel">Ten Cel</option><option value="Maj">Maj</option><option value="Cap">Cap</option><option value="1º Ten">1º Ten</option><option value="2º Ten">2º Ten</option><option value="Asp-a-Of.">Asp-a-Of.</option><option value="Cad">Cad</option><option value="Subten">Subten</option><option value="1º Sgt">1º Sgt</option><option value="2º Sgt">2º Sgt</option><option value="3º Sgt">3º Sgt</option><option value="Cb">Cb</option><option value="Sd">Sd</option></select><div class="error"></div></div>'''

          tempo = '''<div class="field"><label for="tempo">Tempo de serviço na instituição <span class="req">*</span></label><select id="tempo" name="entry.1097052870" required><option value="">Escolher</option><option value="até 5 anos.">até 5 anos.</option><option value="de 5 a 10 anos.">de 5 a 10 anos.</option><option value="De 10 a 15 anos.">De 10 a 15 anos.</option><option value="De 15 a 20 anos.">De 15 a 20 anos.</option><option value="de 20 a 25 anos.">de 20 a 25 anos.</option><option value="Mais de 25 anos de serviço.">Mais de 25 anos de serviço.</option></select><div class="error"></div></div>'''

          ocorrencia = '''<div class="field span-2"><div class="q-title">Já participou de alguma ocorrência de tentativa de suicídio? <span class="req">*</span></div><select id="ocorrencia" name="entry.500885681" required><option value="">Escolher</option><option value="Nunca participei.">Nunca participei.</option><option value="Sim, de 01 a 05 ocorrências">Sim, de 01 a 05 ocorrências</option><option value="Sim, de 06 a 10 ocorrências">Sim, de 06 a 10 ocorrências</option><option value="Sim, em mais de 11 ocorrências">Sim, em mais de 11 ocorrências</option></select><div class="error"></div></div>'''

          presenciou = '''<div class="field span-2"><div class="q-title">Já presenciou algum suicídio completo? <span class="req">*</span></div><select id="presenciou" name="entry.212330805" required><option value="">Escolher</option><option value="Nunca presenciei.">Nunca presenciei.</option><option value="Sim, de 01 a 05 suicídios completos.">Sim, de 01 a 05 suicídios completos.</option><option value="Sim, de 06 a 10 suicídios completos.">Sim, de 06 a 10 suicídios completos.</option><option value="Sim, em mais de 11 suicídios completos.">Sim, em mais de 11 suicídios completos.</option></select><div class="error"></div></div>'''

          hidden = '<input type="hidden" name="fvv" value="1"><input type="hidden" name="pageHistory" value="0,1,2,3"><input type="hidden" name="submit" value="Submit">'

          def patch(path):
              p = Path(path)
              if not p.exists(): return
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<header class="hero">.*?</header>', hero, s, count=1, flags=re.S)
              if css_patch.strip() not in s:
                  s = s.replace('</style>', css_patch + '\n</style>', 1)
              s = re.sub(r'<div class="field"><label for="posto">.*?</div>', posto, s, count=1, flags=re.S)
              s = re.sub(r'<div class="field"><label for="tempo">.*?</div>', tempo, s, count=1, flags=re.S)
              s = re.sub(r'<div class="field span-2"><div class="q-title">Experiência prévia em ocorrência.*?</div>', ocorrencia, s, count=1, flags=re.S)
              s = re.sub(r'<div class="field span-2"><div class="q-title">Já presenciou suicídio completo\?.*?</div>', presenciou, s, count=1, flags=re.S)
              s = s.replace("title: 'Irritabilidade',\n      entry: '',", "title: 'Irritabilidade',\n      entry: 'entry.327261555',")
              if 'name="fvv"' not in s:
                  s = s.replace('novalidate>', 'novalidate>'+hidden, 1)
              s = s.replace('const CONFIG_READY = true;', "const REQUIRED_ENTRIES=['entry.500885681','entry.327261555'];\n  const CONFIG_READY=REQUIRED_ENTRIES.every(n=>document.querySelector(`[name=\\\"${n}\\\"]`));")
              s = s.replace('<div class="success-icon">✓</div><h2>Inscrição registrada</h2><p>Os dados foram enviados com sucesso. Você já pode fechar esta página.</p>', '<div class="success-icon">✓</div><h2>Envio concluído</h2><p>As respostas foram encaminhadas ao formulário Google.</p>')
              p.write_text(s, encoding='utf-8')

          patch('index.html')
          patch('docs/index.html')
          for folder in [Path('assets'), Path('docs/assets')]:
              folder.mkdir(parents=True, exist_ok=True)
              (folder/'cats2026-banner.webp').write_bytes(base64.b64decode(BANNER))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html assets/cats2026-banner.webp docs/assets/cats2026-banner.webp
          git diff --cached --quiet || git commit -m "Ajusta formulário CATS e integração Google Forms [skip ci]"
          git push
