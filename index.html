<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1a27">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>CATS 2026 | Inscrição</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f4f1ea;overflow:hidden}
    #app{display:block;width:100%;height:100dvh;border:0;opacity:0;transition:opacity .16s ease;background:#f4f1ea}
    #app.ready{opacity:1}
    #boot{position:fixed;inset:0;display:grid;place-items:center;font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#52606c;background:#f4f1ea}
    #boot[hidden]{display:none}
    @media(prefers-reduced-motion:reduce){#app{transition:none}}
  </style>
</head>
<body>
  <div id="boot">Carregando formulário…</div>
  <iframe id="app" src="legacy.html" title="Formulário de inscrição CATS 2026"></iframe>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('app');
  const boot = document.getElementById('boot');

  const POSTOS = ['Cel','Ten Cel','Maj','Cap','1º Ten','2º Ten','Asp-a-Of.','Cad','Subten','1º Sgt','2º Sgt','3º Sgt','Cb','Sd'];
  const TEMPO = ['até 5 anos.','de 5 a 10 anos.','De 10 a 15 anos.','De 15 a 20 anos.','de 20 a 25 anos.','Mais de 25 anos de serviço.'];
  const OCORRENCIAS = ['Nunca participei.','Sim, de 01 a 05 ocorrências','Sim, de 06 a 10 ocorrências','Sim, em mais de 11 ocorrências'];
  const PRESENCIOU = ['Nunca presenciei.','Sim, de 01 a 05 suicídios completos.','Sim, de 06 a 10 suicídios completos.','Sim, em mais de 11 suicídios completos.'];

  function makeSelect(doc, old, values){
    const select = doc.createElement('select');
    for(const attr of ['id','name']) if(old.getAttribute(attr)) select.setAttribute(attr, old.getAttribute(attr));
    if(old.required) select.required = true;
    select.setAttribute('aria-label', old.getAttribute('aria-label') || old.id || 'Seleção');
    const first = doc.createElement('option'); first.value=''; first.textContent='Escolher'; select.append(first);
    values.forEach(v => { const o=doc.createElement('option'); o.value=v; o.textContent=v; select.append(o); });
    old.replaceWith(select);
    return select;
  }

  function setOptions(select, values){
    select.replaceChildren();
    const first = select.ownerDocument.createElement('option'); first.value=''; first.textContent='Escolher'; select.append(first);
    values.forEach(v => { const o=select.ownerDocument.createElement('option'); o.value=v; o.textContent=v; select.append(o); });
  }

  function hidden(doc, form, name, value){
    let el=form.querySelector(`input[name="${name}"]`);
    if(!el){ el=doc.createElement('input'); el.type='hidden'; el.name=name; form.append(el); }
    el.value=value;
  }

  frame.addEventListener('load', () => {
    try{
      const doc = frame.contentDocument;
      const form = doc.getElementById('catsForm');
      if(!doc || !form) throw new Error('Estrutura do formulário não encontrada');

      doc.title = 'CATS 2026 | Inscrição';

      const style = doc.createElement('style');
      style.textContent = `
        :root{--cats-orange:#ec6b1b;--cats-navy:#0a1b29}
        body{overflow-x:hidden}
        .hero{padding:12px 0 18px}
        .hero-card{padding:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
        .hero-card:after{display:none!important}
        .hero-banner{display:block;width:min(100%,560px);height:auto;margin-inline:auto;border-radius:20px;box-shadow:0 16px 44px rgba(9,25,38,.22)}
        .hero-copy{width:min(100%,760px);margin:14px auto 0;text-align:center;padding-inline:8px}
        .hero-copy h1{margin:.2rem 0 .45rem;color:#17324d;font-size:clamp(1.35rem,6vw,2.2rem);line-height:1.08}
        .hero-copy p{margin:0;color:#66717c}
        select{min-height:48px;background:#fff}
        input,select,textarea,.choice span{font-size:16px}
        .card{scroll-margin-top:58px}
        @media(min-width:760px){.hero{padding-top:24px}.hero-banner{width:min(100%,620px)}.card{padding:26px}.grid{gap:16px}}
      `;
      doc.head.append(style);

      const header = doc.querySelector('header.hero');
      if(header){
        header.innerHTML = `<div class="shell"><div class="hero-card"><img class="hero-banner" src="assets/cats2026-banner.webp" alt="Banner oficial do CATS 2026 — VII edição" width="256" height="256" decoding="async" fetchpriority="high"><div class="hero-copy"><h1>Curso de Atendimento a Tentativas de Suicídio — CATS 2026</h1><p>Formulário de inscrição e levantamento prévio.</p></div></div></div>`;
      }

      const posto = doc.getElementById('posto');
      if(posto && posto.tagName !== 'SELECT') makeSelect(doc, posto, POSTOS);
      const tempo = doc.getElementById('tempo');
      if(tempo && tempo.tagName !== 'SELECT') makeSelect(doc, tempo, TEMPO);

      const ocorrencia = doc.getElementById('ocorrencia');
      if(ocorrencia){ ocorrencia.name='entry.500885681'; setOptions(ocorrencia, OCORRENCIAS); }
      const presenciou = doc.getElementById('presenciou');
      if(presenciou){ presenciou.name='entry.212330805'; setOptions(presenciou, PRESENCIOU); }

      doc.querySelectorAll('input[name="temp_clinical_16"]').forEach(el => el.name='entry.327261555');

      hidden(doc,form,'fvv','1');
      hidden(doc,form,'pageHistory','0,1,2,3');
      hidden(doc,form,'submit','Submit');

      const success = doc.getElementById('success');
      if(success){
        const h=success.querySelector('h2'); if(h) h.textContent='Envio concluído';
        const p=success.querySelector('p'); if(p) p.textContent='As respostas foram encaminhadas ao Google Forms.';
      }

      const state = doc.getElementById('configState');
      if(state) state.textContent='Integração com o Google Forms configurada.';

      ['posto','tempo','ocorrencia','presenciou'].forEach(id => {
        const el=doc.getElementById(id);
        if(el) el.addEventListener('change',()=>{ el.classList.remove('invalid'); const er=el.closest('.field')?.querySelector('.error'); if(er) er.textContent=''; });
      });

      boot.hidden=true;
      frame.classList.add('ready');
    }catch(err){
      boot.textContent='Não foi possível carregar o formulário. Atualize a página.';
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
