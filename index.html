<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>VIII CATS 2026 | Boas-vindas — Pouso Alegre</title>
  <link rel="canonical" href="https://ricmurtapsicologia.github.io/CATS.pousoalegre/">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%2307101f"/><path d="M32 11l5.2 10.5L49 23.2l-8.5 8.3 2 11.7L32 37.7 21.5 43.2l2-11.7L15 23.2l11.8-1.7z" fill="%23ffdd00"/></svg>'>

  <meta property="og:locale" content="pt_BR">

  <meta property="og:image:secure_url" content="https://i.pinimg.com/736x/56/4d/63/564d63712210ee0e48975b8c57392db7.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="VIII CATS 2026 | Boas-vindas — Pouso Alegre">
  <meta name="twitter:description" content="Boas-vindas e levantamento prévio do VIII CATS 2026 — CBMMG.">

  <link rel="preconnect" href="https://i.pinimg.com" crossorigin>

  <style>
    :root{color-scheme:light;--bg:#f4f1ea;--ink:#17212b;--muted:#66717c}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
    #app{display:block;width:100%;height:100dvh;border:0;opacity:0;transition:opacity .18s ease;background:var(--bg)}
    #app.ready{opacity:1}
    #boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:650 14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--muted);background:var(--bg)}
    #boot[hidden]{display:none}
    @media(prefers-reduced-motion:reduce){#app{transition:none}}
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">Carregando formulário…</div>
  <iframe id="app" src="legacy.html" title="VIII CATS 2026 — levantamento prévio em Pouso Alegre" referrerpolicy="same-origin"></iframe>

<script>
(() => {
  'use strict';

  const CFG = Object.freeze({
    title:'VIII CATS 2026 | Boas-vindas — Pouso Alegre',
    hero:'https://i.pinimg.com/736x/29/42/2a/29422ad8bed8166ef119bcef4792218f.jpg'
  });

  const frame=document.getElementById('app');
  const boot=document.getElementById('boot');

  const POSTOS=['Cel','Ten Cel','Maj','Cap','1º Ten','2º Ten','Asp-a-Of.','Cad','Subten','1º Sgt','2º Sgt','3º Sgt','Cb','Sd'];
  const TEMPO=['até 5 anos.','de 5 a 10 anos.','De 10 a 15 anos.','De 15 a 20 anos.','de 20 a 25 anos.','Mais de 25 anos de serviço.'];
  const OCORRENCIAS=['Nunca participei.','Sim, de 01 a 05 ocorrências','Sim, de 06 a 10 ocorrências','Sim, em mais de 11 ocorrências'];
  const PRESENCIOU=['Nunca presenciei.','Sim, de 01 a 05 suicídios completos.','Sim, de 06 a 10 suicídios completos.','Sim, em mais de 11 suicídios completos.'];

  function makeSelect(doc,old,values){
    const select=doc.createElement('select');
    for(const attr of ['id','name']) if(old.getAttribute(attr)) select.setAttribute(attr,old.getAttribute(attr));
    if(old.required) select.required=true;
    select.setAttribute('aria-label',old.getAttribute('aria-label')||old.id||'Seleção');
    const first=doc.createElement('option');
    first.value='';
    first.textContent='Escolher';
    select.append(first);
    values.forEach(v=>{
      const option=doc.createElement('option');
      option.value=v;
      option.textContent=v;
      select.append(option);
    });
    old.replaceWith(select);
    return select;
  }

  function setOptions(select,values){
    select.replaceChildren();
    const first=select.ownerDocument.createElement('option');
    first.value='';
    first.textContent='Escolher';
    select.append(first);
    values.forEach(v=>{
      const option=select.ownerDocument.createElement('option');
      option.value=v;
      option.textContent=v;
      select.append(option);
    });
  }

  function hidden(doc,form,name,value){
    let el=form.querySelector(`input[name="${name}"]`);
    if(!el){
      el=doc.createElement('input');
      el.type='hidden';
      el.name=name;
      form.append(el);
    }
    el.value=value;
  }

  function installVisual(doc){
    const style=doc.createElement('style');
    style.textContent=`
      :root{--cats-navy:#07101f;--cats-blue:#003366;--cats-gold:#ffdd00;--cats-hero:url("${CFG.hero}")}
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
      body{overflow-x:hidden;background:linear-gradient(180deg,#ece8df 0,#f7f5f0 360px,#f4f1ea 100%)}
      .hero{padding:14px 0 18px}
      .hero-card{position:relative;min-height:270px;display:flex!important;flex-direction:column;justify-content:space-between;padding:22px!important;overflow:hidden!important;border:1px solid rgba(255,255,255,.11)!important;border-radius:24px!important;background:linear-gradient(105deg,rgba(0,0,0,.88),rgba(0,0,0,.58) 54%,rgba(0,0,0,.88)),var(--cats-hero) 62% center/cover no-repeat!important;box-shadow:0 24px 60px rgba(3,8,16,.28)!important;color:#fff!important}
      .hero-card:after{display:none!important}
      .course-brand{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.92);font-size:11px;font-weight:850;letter-spacing:.085em;text-transform:uppercase}
      .course-star{color:var(--cats-gold);font-size:16px;line-height:1}
      .hero-copy{max-width:720px;margin-top:28px}
      .hero-kicker{display:block;margin-bottom:8px;color:var(--cats-gold);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
      .hero-copy h1{max-width:680px;margin:0;color:#fff!important;font-size:clamp(1.75rem,8vw,2.65rem)!important;line-height:1.02!important;letter-spacing:-.045em;text-shadow:0 6px 24px rgba(0,0,0,.58)}
      .hero-copy h1 span{color:var(--cats-gold)}
      .hero-copy p{max-width:680px;margin:12px 0 0;color:rgba(255,255,255,.9)!important;font-size:15px;line-height:1.5;text-shadow:0 3px 12px rgba(0,0,0,.38)}
      .hero-copy p strong{color:#fff;font-weight:850}
      .hero-signature{display:grid;gap:1px;margin-top:13px;color:rgba(255,255,255,.82);font-size:12.5px;line-height:1.35;text-shadow:0 3px 12px rgba(0,0,0,.38)}
      .hero-signature strong{color:#fff;font-size:13px;font-weight:850}
      .progress-wrap{top:0!important;z-index:20!important;background:rgba(244,241,234,.94)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
      .progress-bar{background:linear-gradient(90deg,var(--cats-blue),var(--cats-gold))!important}
      .card{scroll-margin-top:66px}
      input,select,textarea{min-height:48px;font-size:16px!important}
      textarea{min-height:118px}
      .choice span{min-height:46px;display:flex!important;align-items:center;font-size:15px!important;line-height:1.4}
      .btn{min-height:48px;touch-action:manipulation}
      .btn-primary{background:linear-gradient(180deg,#07569f,#003366 58%,#001f3f)!important;color:#fff!important}
      .btn-primary:focus-visible,.btn-secondary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(0,86,159,.24);outline-offset:2px}
      .cats-footer{margin-top:10px!important;padding:0 0 max(28px,env(safe-area-inset-bottom))!important;color:#5f6972!important;text-align:center!important}
      .cats-footer-panel{position:relative;padding:20px 16px 4px;border-top:1px solid #d7d2c7}
      .cats-footer-panel:before{content:"";position:absolute;top:-1px;left:50%;width:54px;height:2px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(90deg,var(--cats-blue),var(--cats-gold))}
      .cats-footer-brand{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:6px;color:#273746;font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
      .cats-footer-brand span:first-child{color:#c8a900;font-size:14px}
      .cats-footer-copy{margin:0;font-size:12px;line-height:1.55;color:#66717c}
      .cats-footer-copy strong{color:#3b4752;font-weight:800}
      @media(min-width:760px){.hero{padding:22px 0}.hero-card{min-height:300px;padding:30px!important;border-radius:28px!important}.hero-copy{margin-top:32px}.hero-kicker{font-size:12px}.hero-copy p{font-size:16px}.hero-signature{font-size:13px}.hero-signature strong{font-size:13.5px}.card{padding:26px}.grid{gap:16px}.cats-footer-panel{padding-top:22px}}
      @media(max-width:420px){.shell{width:min(calc(100% - 20px),var(--max))!important}.hero-card{min-height:290px;padding:18px!important;border-radius:20px!important;background-position:66% center!important}.hero-copy{margin-top:22px}.hero-copy h1{font-size:clamp(1.6rem,8vw,2rem)!important}.hero-copy p{font-size:14px;line-height:1.45}.hero-signature{font-size:12px}.hero-signature strong{font-size:12.5px}.card{padding:15px!important}.section-head{gap:10px}.actions{gap:8px}.cats-footer-copy{font-size:11.5px}}
      @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
    `;
    doc.head.append(style);

    const header=doc.querySelector('header.hero');
    if(header) header.innerHTML=`<div class="shell"><div class="hero-card"><div class="course-brand"><span class="course-star" aria-hidden="true">★</span><span>CBMMG • Pouso Alegre</span></div><div class="hero-copy"><span class="hero-kicker">VIII CATS 2026 • Boas-vindas</span><h1>Curso de Atendimento a Tentativas de <span>Suicídio</span></h1><p>Seja bem-vindo(a). Sua participação começa aqui. Reserve alguns minutos para preencher o formulário a seguir: suas respostas nos ajudam a compreender o perfil da turma e a tornar a experiência de aprendizagem mais direcionada e relevante. <strong>O preenchimento é obrigatório.</strong></p><div class="hero-signature"><span>Cordialmente,</span><strong>Lucas Oliveira, Capitão BM</strong><span>Coordenador do VIII CATS</span></div></div></div></div>`;
  }

  function installFooter(doc){
    const footer=doc.querySelector('footer.footer');
    if(!footer)return;
    footer.className='shell footer cats-footer';
    footer.setAttribute('aria-label','Informações institucionais e direitos autorais');
    footer.innerHTML=`<div class="cats-footer-panel"><div class="cats-footer-brand"><span aria-hidden="true">★</span><span>CBMMG • VIII CATS 2026</span></div><p class="cats-footer-copy"><strong>© 2026 CBMMG — Equipe de Coordenação do CATS.</strong><br>Todos os direitos reservados.</p></div>`;
  }

  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      const form=doc?.getElementById('catsForm');
      if(!doc||!form) throw new Error('Estrutura do formulário não encontrada');

      doc.title=CFG.title;
      installVisual(doc);
      installFooter(doc);

      const posto=doc.getElementById('posto');
      if(posto&&posto.tagName!=='SELECT') makeSelect(doc,posto,POSTOS);

      const tempo=doc.getElementById('tempo');
      if(tempo&&tempo.tagName!=='SELECT') makeSelect(doc,tempo,TEMPO);

      const ocorrencia=doc.getElementById('ocorrencia');
      if(ocorrencia){
        ocorrencia.name='entry.500885681';
        setOptions(ocorrencia,OCORRENCIAS);
      }

      const presenciou=doc.getElementById('presenciou');
      if(presenciou){
        presenciou.name='entry.212330805';
        setOptions(presenciou,PRESENCIOU);
      }

      doc.querySelectorAll('input[name="temp_clinical_16"]').forEach(el=>el.name='entry.327261555');

      hidden(doc,form,'fvv','1');
      hidden(doc,form,'pageHistory','0,1,2,3');
      hidden(doc,form,'submit','Submit');

      const success=doc.getElementById('success');
      if(success){
        const h=success.querySelector('h2');
        const p=success.querySelector('p');
        if(h) h.textContent='Envio concluído';
        if(p) p.textContent='As respostas foram encaminhadas ao formulário oficial.';
      }

      const state=doc.getElementById('configState');
      if(state) state.textContent='Formulário pronto para envio.';

      ['posto','tempo','ocorrencia','presenciou'].forEach(id=>{
        const el=doc.getElementById(id);
        if(el) el.addEventListener('change',()=>{
          el.classList.remove('invalid');
          const error=el.closest('.field')?.querySelector('.error');
          if(error) error.textContent='';
        });
      });

      boot.hidden=true;
      frame.classList.add('ready');
    }catch(error){
      boot.textContent='Não foi possível preparar o formulário. Atualize a página.';
      console.error('[CATS]',error);
    }
  });
})();
</script>
</body>
</html>
