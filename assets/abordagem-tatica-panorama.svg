<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo geral do Sistema ATS</title>
  <desc id="desc">Representação panorâmica do processo operacional do acionamento ao encerramento, incluindo abordagem técnica, prontidão tática paralela e transição, entrada e contenção.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#285a73"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0b5d66}.sub{font:20px Arial,sans-serif;fill:#333}.node{fill:#fff;stroke:#285a73;stroke-width:3;rx:8}.txt{font:18px Arial,sans-serif;fill:#202b33;text-anchor:middle;dominant-baseline:middle}.flow{fill:none;stroke:#285a73;stroke-width:3;marker-end:url(#arrow)}.foot{font:15px Arial,sans-serif;fill:#444}
    </style>
  </defs>
  <rect width="1600" height="540" fill="#fff"/>
  <text x="28" y="48" class="title">FLUXO GERAL DO SISTEMA ATS</text>
  <text x="28" y="82" class="sub">Representação panorâmica do processo operacional — do acionamento ao encerramento</text>

  <rect class="node" x="60" y="130" width="170" height="64"/><text class="txt" x="145" y="162">Acionamento</text>
  <rect class="node" x="250" y="130" width="170" height="64"/><text class="txt" x="335" y="162">Despacho</text>
  <rect class="node" x="440" y="130" width="180" height="64"/><text class="txt" x="530" y="162">Deslocamento</text>
  <rect class="node" x="640" y="130" width="190" height="64"/><text class="txt" x="735" y="162">Estabelecimento</text>
  <rect class="node" x="850" y="130" width="200" height="64"/><text class="txt" x="950" y="162">Observação inicial</text>
  <rect class="node" x="1070" y="130" width="200" height="64"/><text class="txt" x="1170" y="162">Passagem / comando</text>
  <rect class="node" x="1290" y="130" width="240" height="64"/><text class="txt" x="1410" y="154"><tspan x="1410" dy="0">Avaliação e</tspan><tspan x="1410" dy="22">isolamento</tspan></text>

  <path class="flow" d="M230 162H250"/><path class="flow" d="M420 162H440"/><path class="flow" d="M620 162H640"/><path class="flow" d="M830 162H850"/><path class="flow" d="M1050 162H1070"/><path class="flow" d="M1270 162H1290"/>

  <rect class="node" x="150" y="275" width="220" height="70"/><text class="txt" x="260" y="298"><tspan x="260" dy="0">Coleta de</tspan><tspan x="260" dy="22">informações</tspan></text>
  <rect class="node" x="430" y="275" width="240" height="70"/><text class="txt" x="550" y="298"><tspan x="550" dy="0">Gerenciamento e</tspan><tspan x="550" dy="22">plano</tspan></text>
  <rect class="node" x="740" y="275" width="220" height="70"/><text class="txt" x="850" y="310">Abordagem técnica</text>
  <rect class="node" x="1010" y="275" width="250" height="70"/><text class="txt" x="1135" y="298"><tspan x="1135" dy="0">Prontidão tática</tspan><tspan x="1135" dy="22">paralela</tspan></text>
  <rect class="node" x="1300" y="275" width="240" height="70"/><text class="txt" x="1420" y="298"><tspan x="1420" dy="0">Transição, entrada e</tspan><tspan x="1420" dy="22">contenção</tspan></text>

  <path class="flow" d="M335 194V275"/><path class="flow" d="M530 194V275"/><path class="flow" d="M950 194V275"/><path class="flow" d="M1170 194V275"/><path class="flow" d="M1410 194V275"/>
  <path class="flow" d="M370 310H430"/><path class="flow" d="M670 310H740"/><path class="flow" d="M960 310H1010"/><path class="flow" d="M1260 310H1300"/>

  <rect class="node" x="470" y="410" width="230" height="64"/><text class="txt" x="585" y="442">APH / encaminhamento</text>
  <rect class="node" x="880" y="410" width="430" height="64"/><text class="txt" x="1095" y="430"><tspan x="1095" dy="0">Encerramento, registro e</tspan><tspan x="1095" dy="22">pós-ocorrência</tspan></text>
  <path class="flow" d="M550 345V410"/><path class="flow" d="M1420 345V385H1095V410"/>

  <text x="28" y="515" class="foot">Adaptação didática do fluxo processual apresentado no Manual do Participante CATS 2026.</text>
</svg>